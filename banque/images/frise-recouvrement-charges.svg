<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-label="Frise du circuit de recouvrement des charges de copropriété impayées">
  <title>Circuit de recouvrement des charges impayées — frise de principe</title>
  <desc>Six étapes dans l'ordre chronologique, de l'exigibilité de la provision à l'exécution forcée, avec les deux voies judiciaires possibles.</desc>

  <rect x="0" y="0" width="1100" height="420" fill="#ffffff"/>

  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3d5c"/>
    </marker>
  </defs>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1a3d5c">

    <text x="30" y="36" font-size="18" font-weight="bold">Recouvrement des charges impayées — les six étapes</text>
    <text x="30" y="56" font-size="12" fill="#5a6b78">Schéma original, Académie. Le délai marqué « ? » est l'objet de l'exercice.</text>

    <!-- boîtes -->
    <g>
      <rect x="30" y="172" width="152" height="72" rx="6" fill="#eef2f6" stroke="#1a3d5c" stroke-width="2.5"/>
      <rect x="206" y="172" width="152" height="72" rx="6" fill="#eef2f6" stroke="#1a3d5c" stroke-width="2.5"/>
      <rect x="382" y="172" width="152" height="72" rx="6" fill="#dbe6ef" stroke="#1a3d5c" stroke-width="2.5"/>
      <rect x="558" y="172" width="152" height="72" rx="6" fill="#dbe6ef" stroke="#1a3d5c" stroke-width="3"/>
      <rect x="734" y="172" width="152" height="72" rx="6" fill="#eef2f6" stroke="#1a3d5c" stroke-width="2.5"/>
      <rect x="910" y="172" width="152" height="72" rx="6" fill="#eef2f6" stroke="#1a3d5c" stroke-width="2.5"/>
    </g>

    <!-- libellés -->
    <g font-size="14" text-anchor="middle">
      <text x="106" y="206">Exigibilité de la</text><text x="106" y="224">provision</text>
      <text x="282" y="215">Relance simple</text>
      <text x="458" y="206">Mise en demeure</text><text x="458" y="224">(LRAR ou LRE)</text>
      <text x="634" y="206">Déchéance du terme</text><text x="634" y="224">(art. 19-2)</text>
      <text x="810" y="215">Titre exécutoire</text>
      <text x="986" y="204">Exécution forcée</text><text x="986" y="224" font-size="12">par commissaire de justice</text>
    </g>

    <!-- repères -->
    <g font-size="14" font-weight="bold">
      <circle cx="30" cy="172" r="15" fill="#1a3d5c"/><text x="30" y="178" fill="#ffffff" text-anchor="middle">1</text>
      <circle cx="206" cy="172" r="15" fill="#1a3d5c"/><text x="206" y="178" fill="#ffffff" text-anchor="middle">2</text>
      <circle cx="382" cy="172" r="15" fill="#1a3d5c"/><text x="382" y="178" fill="#ffffff" text-anchor="middle">3</text>
      <circle cx="558" cy="172" r="15" fill="#1a3d5c"/><text x="558" y="178" fill="#ffffff" text-anchor="middle">4</text>
      <circle cx="734" cy="172" r="15" fill="#1a3d5c"/><text x="734" y="178" fill="#ffffff" text-anchor="middle">5</text>
      <circle cx="910" cy="172" r="15" fill="#1a3d5c"/><text x="910" y="178" fill="#ffffff" text-anchor="middle">6</text>
    </g>

    <!-- flèches -->
    <g stroke="#1a3d5c" stroke-width="2.5" marker-end="url(#fl)">
      <line x1="182" y1="208" x2="204" y2="208"/>
      <line x1="358" y1="208" x2="380" y2="208"/>
      <line x1="534" y1="208" x2="556" y2="208"/>
      <line x1="710" y1="208" x2="732" y2="208"/>
      <line x1="886" y1="208" x2="908" y2="208"/>
    </g>

    <!-- délais au-dessus des flèches -->
    <g font-size="13" text-anchor="middle" fill="#5a6b78">
      <text x="106" y="140">J</text>
      <text x="193" y="140">15 à 30 j</text>
      <text x="370" y="140">J+30 environ</text>
      <text x="545" y="132" font-size="20" font-weight="bold" fill="#1a3d5c">?</text>
      <text x="721" y="140">voie choisie</text>
      <text x="897" y="140">signification</text>
    </g>
    <g stroke="#c3cdd6" stroke-width="1.2" stroke-dasharray="4 4">
      <line x1="106" y1="148" x2="106" y2="164"/>
      <line x1="193" y1="148" x2="193" y2="196"/>
      <line x1="370" y1="148" x2="370" y2="196"/>
      <line x1="545" y1="142" x2="545" y2="196"/>
      <line x1="721" y1="148" x2="721" y2="196"/>
      <line x1="897" y1="148" x2="897" y2="196"/>
    </g>

    <!-- les deux voies judiciaires, entre la déchéance et le titre -->
    <rect x="576" y="288" width="290" height="94" rx="6" fill="#ffffff" stroke="#6b7a88" stroke-width="1.8" stroke-dasharray="6 4"/>
    <line x1="721" y1="288" x2="721" y2="250" stroke="#6b7a88" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="721" y="312" font-size="12" text-anchor="middle" fill="#5a6b78">Deux voies au choix du syndic</text>
    <text x="721" y="338" font-size="13" text-anchor="middle">Injonction de payer (art. 1405 et s. CPC)</text>
    <text x="721" y="362" font-size="13" text-anchor="middle">Procédure accélérée au fond (art. 19-2)</text>

  </g>
</svg>
